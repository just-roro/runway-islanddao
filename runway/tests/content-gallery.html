<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>RUNWAY — source model contact sheet</title>
 <style>
  *{box-sizing:border-box}body{margin:0;padding:40px;background:#081b2b;color:#f4eedc;font:16px/1.4 Arial,sans-serif}
  header{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid #326077;padding-bottom:20px;margin-bottom:24px;gap:40px}
  h1{font-size:32px;letter-spacing:1px;margin:0}header p{max-width:560px;margin:0;color:#a2c0d0;font-size:14px}
  .eyebrow{color:#5de1d4;text-transform:uppercase;letter-spacing:3px;font-size:12px;font-weight:bold;margin-bottom:8px}
  main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
  article{border:1px solid #326077;border-radius:12px;overflow:hidden;background:#102a40;min-width:0}
  .preview{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:radial-gradient(ellipse at 50% 45%,#214561,#102a40 70%)}
  .caption{padding:14px 18px 18px;border-top:1px solid #2b5268;min-height:116px}
  .key{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
  code{font-size:15px;color:#65e8df;font-weight:bold}.group{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#a9cbd9}
  .name{font-size:19px;font-weight:bold;margin:0 0 5px}.effect{font-size:12px;color:#b9d1dc;margin:0}
  footer{display:flex;justify-content:space-between;gap:30px;color:#89a8b9;font-size:12px;margin-top:22px}
  [data-group=Obstacle] code{color:#ff9485}[data-group=Challenge] code{color:#ffe173}
 </style>
</head>
<body>
 <header><div><div class="eyebrow">RUNWAY / Content audit</div><h1>ACTUAL GAMEPLAY MODELS</h1></div><p>Source geometry from <code>src/scene/props.ts</code>. One camera, lighting setup and frame for all objects. These are existing assets, not redesign proposals.</p></header>
 <main id="gallery"></main>
 <footer><span id="version"></span><span>Utility / reward / obstacle materials match gameplay. Animated ring frozen at t = 0.</span></footer>
 <script type="module">
  import * as T from 'three';
  import {propGeometry} from '/src/scene/props.ts';
  import {CONTENT_CATALOG,RULES,CONTENT} from '/src/core/simulation.ts';
  const ids=['sol','term','community','star','gate','magnet','water','rare','delivery','gas','rug','hacked'];
  const renderer=new T.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});
  renderer.setSize(520,390);renderer.setPixelRatio(1);renderer.setClearColor(0,0);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
  const camera=new T.PerspectiveCamera(33,4/3,.05,100);camera.position.set(2,2.6,5.4);camera.lookAt(0,0,0);
  const scene=new T.Scene();scene.add(new T.HemisphereLight('#e8f8ff','#365568',1.8));
  const key=new T.DirectionalLight('#ffe9c9',3);key.position.set(-3,6,5);scene.add(key);
  const fill=new T.DirectionalLight('#72d6eb',.7);fill.position.set(3,1,-3);scene.add(fill);
  const stats=[];
  for(const id of ids){
   const entry=CONTENT_CATALOG.find(item=>item.id===id);
   const geometry=propGeometry(id);
   // The same material parameters and stripe shader as World.tsx / PropMaterial.
   const material=new T.MeshStandardMaterial({vertexColors:true,roughness:id==='sol'?.3:.58,metalness:id==='sol'?.45:.08,emissive:['delivery','gas','rug','hacked'].includes(id)?'#ff392e':'#23ff9d',emissiveIntensity:.12});
   if(id==='gate')material.onBeforeCompile=shader=>{
    shader.uniforms.ringClock={value:0};
    shader.vertexShader='varying vec3 ringPosition;\n'+shader.vertexShader;
    shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nringPosition=position;');
    shader.fragmentShader='varying vec3 ringPosition;uniform float ringClock;\n'+shader.fragmentShader;
    shader.fragmentShader=shader.fragmentShader.replace('#include <color_fragment>',`#include <color_fragment>
     if(length(ringPosition.xy)<1.1){float stripe=step(.5,fract(atan(ringPosition.y,ringPosition.x)*2.54648-ringClock*.65));diffuseColor.rgb=mix(vec3(.97,.91,.8),vec3(.85,.025,.018),stripe);}else if(ringPosition.y>1.17){diffuseColor.rgb=vec3(2.5,.06,.025)*(.35+.65*step(.2,sin(ringClock*7.)));}`);
   };
   const mesh=new T.Mesh(geometry,material);scene.add(mesh);renderer.render(scene,camera);
   const card=document.createElement('article');card.dataset.group=entry.group;
   const img=document.createElement('img');img.className='preview';img.alt=entry.name+' — '+id;img.src=renderer.domElement.toDataURL('image/png');
   const caption=document.createElement('div');caption.className='caption';
   const line=document.createElement('div');line.className='key';
   const code=document.createElement('code');code.textContent=id;
   const group=document.createElement('span');group.className='group';group.textContent=entry.group;line.append(code,group);
   const name=document.createElement('p');name.className='name';name.textContent=entry.name;
   const effect=document.createElement('p');effect.className='effect';effect.textContent=entry.effect;
   caption.append(line,name,effect);card.append(img,caption);document.querySelector('#gallery').append(card);
   stats.push({id,triangles:(geometry.index?.count||geometry.attributes.position.count)/3});scene.remove(mesh);geometry.dispose();material.dispose();
  }
  document.querySelector('#version').textContent=`${RULES} / ${CONTENT} · 12 active prop models`;
  await Promise.all([...document.images].map(img=>img.decode()));
  renderer.dispose();window.__CONTENT_GALLERY_READY__={ids,stats,camera:camera.position.toArray()};
 </script>
</body>
</html>
